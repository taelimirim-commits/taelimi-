```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحميل تطبيق تعليمي</title>

<style>
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f5f6fa;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #222;
  }

  p {
    color: #555;
    margin-bottom: 24px;
  }

  .links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  a.btn {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 8px;
    background: #1a73e8;
    color: #fff;
    text-decoration: none;
    font-weight: bold;
  }

  a.btn:hover {
    opacity: 0.9;
  }
</style>
</head>

<body>

  <h1>جاري تحويلك لتحميل تطبيق تعليمي...</h1>

  <p>إذا لم يتم تحويلك تلقائيًا، اختر متجرك:</p>

  <div class="links">
    <a class="btn"
       href="https://play.google.com/store/apps/details?id=com.tealimy.com">
       Google Play
    </a>

    <a class="btn"
       href="https://apps.apple.com/pa/app/taelimy/id6756333904">
       App Store
    </a>
  </div>

<script>
  var ua = navigator.userAgent || navigator.vendor || window.opera;

  var androidUrl =
    "https://play.google.com/store/apps/details?id=com.tealimy.com";

  var iosUrl =
    "https://apps.apple.com/pa/app/taelimy/id6756333904";

  if (/android/i.test(ua)) {
    window.location.href = androidUrl;
  } else if (/iPad|iPhone|iPod/.test(ua) ||
             (navigator.platform === "MacIntel" &&
              navigator.maxTouchPoints > 1)) {
    window.location.href = iosUrl;
  }
  // على أجهزة الكمبيوتر، تظهر خيارات المتاجر.
</script>

</body>
</html>
```
